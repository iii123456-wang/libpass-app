<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#F2EFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#26232A" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LibPass">
<title>LibPass · 备考打卡</title>
<style>
/* ============ 基础与主题变量(莫兰迪暖灰 + 雾霾粉紫) ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg0:#F2EFEA;--bg1:#E9E3E3;
  --pink:#D9BFC9;--purple:#B5A8CE;
  --card:rgba(255,255,255,.66);--card2:rgba(255,255,255,.45);
  --ink:#48424A;--mut:#8A8089;--faint:#B7AEB5;
  --line:rgba(120,105,120,.16);
  --pri:#8F76AD;--pri-deep:#7C639B;--pinkd:#C08CA4;
  --ok:#0F5132;--okbg:rgba(15,81,50,.10);
  --warn:#B0575F;--warnbg:rgba(176,87,95,.10);
  --shadow:0 10px 30px rgba(90,70,95,.10);
  --r:20px;
  --navbg:rgba(250,248,246,.88);
}
html[data-theme="dark"]{
  --bg0:#26232A;--bg1:#2C2731;
  --card:rgba(255,255,255,.06);--card2:rgba(255,255,255,.045);
  --ink:#EAE4E9;--mut:#A79DAA;--faint:#6E6472;
  --line:rgba(255,255,255,.10);
  --pri:#B49BD3;--pri-deep:#C7B2E0;--pinkd:#D6A3B8;
  --ok:#7FC8A0;--okbg:rgba(127,200,160,.14);
  --warn:#D98A91;--warnbg:rgba(217,138,145,.14);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --navbg:rgba(34,31,39,.88);
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Source Han Sans SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  color:var(--ink);font-size:15px;line-height:1.55;
  background:linear-gradient(160deg,var(--bg0),var(--bg1)) fixed;
  min-height:100dvh;
}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
::placeholder{color:var(--faint)}
/* 背景雾霾光斑 */
#bgfx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#bgfx i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
#bgfx .b1{width:46vmax;height:46vmax;right:-14vmax;top:-16vmax;background:radial-gradient(circle,#DCBECB,transparent 65%)}
#bgfx .b2{width:52vmax;height:52vmax;left:-18vmax;bottom:-20vmax;background:radial-gradient(circle,#BFB2D6,transparent 65%)}
html[data-theme="dark"] #bgfx i{opacity:.16}

/* ============ 头部 ============ */
header{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
#logoTile{width:34px;height:34px;border-radius:9px;flex:none;box-shadow:0 3px 8px rgba(140,110,160,.3)}
.htxt{flex:1;min-width:0}
.htxt b{font-size:17px;letter-spacing:.4px;display:block;line-height:1.2}
.htxt span{font-size:11px;color:var(--mut)}
#cdChip{flex:none;font-size:12px;font-weight:600;color:var(--pri-deep);background:rgba(143,118,173,.13);
  border:1px solid rgba(143,118,173,.22);border-radius:999px;padding:5px 11px;white-space:nowrap}
#gearBtn{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--mut)}
#gearBtn:active{background:var(--card2)}

/* ============ 主体与卡片 ============ */
main{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:14px 14px calc(96px + env(safe-area-inset-bottom))}
.tab{display:none}
.tab.active{display:block}
.cards{display:grid;gap:14px}
.cards>*{min-width:0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 16px 15px;box-shadow:var(--shadow);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.card h3{font-size:15px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:7px;margin-bottom:11px}
.card h3 .hact{margin-left:auto;font-size:12px;font-weight:500;color:var(--pri-deep)}
.span2{grid-column:1/-1}
@media(min-width:900px){
  main{max-width:960px}
  .cards{grid-template-columns:1fr 1fr;gap:16px}
}
.mut{color:var(--mut)}.small{font-size:12px}
.rowbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* ============ 按钮 ============ */
.btn-main{
  width:100%;padding:14px;border-radius:16px;font-size:16.5px;font-weight:700;color:#fff;
  background:linear-gradient(135deg,#9A7FBC,#CE93AB);letter-spacing:2px;
  box-shadow:0 8px 20px rgba(150,110,160,.32);transition:transform .06s;
}
.btn-main:active{transform:translateY(1px) scale(.995)}
.btn-main:disabled{opacity:.55;box-shadow:none}
.btn-main.sm{width:auto;padding:9px 16px;font-size:13.5px;letter-spacing:.5px;border-radius:12px;box-shadow:none}
.btn-ok{background:linear-gradient(135deg,#2E7D4F,#3C9463);box-shadow:0 8px 20px rgba(15,81,50,.28)}
.btn-ghost{
  padding:8px 13px;border-radius:12px;font-size:13px;color:var(--ink);
  background:var(--card2);border:1px solid var(--line);
}
.btn-danger{color:var(--warn);border-color:rgba(176,87,95,.3)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;
  background:rgba(143,118,173,.12);color:var(--pri-deep)}
.chip.pink{background:rgba(192,140,164,.14);color:#A66880}
html[data-theme="dark"] .chip.pink{color:var(--pinkd)}
.chip.ok{background:var(--okbg);color:var(--ok)}
.chip.warn{background:var(--warnbg);color:var(--warn)}
.chip.gray{background:var(--card2);color:var(--mut)}

/* ============ 今日页 ============ */
.ck-status{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px;color:var(--mut);flex-wrap:wrap}
.ck-status b{color:var(--ink)}
.locsel{width:100%;margin-bottom:10px}
.prox{font-size:12.5px;color:var(--mut);margin-top:10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.streakline{margin-top:10px;font-size:13px;color:var(--mut);display:flex;gap:14px}
.streakline b{color:var(--pri-deep);font-size:15px}
.emojiGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:7px}
.emojiGrid button{
  aspect-ratio:1;border-radius:13px;font-size:21px;display:grid;place-items:center;
  background:var(--card2);border:1.5px solid transparent;transition:transform .08s;
}
.emojiGrid button:active{transform:scale(.92)}
.emojiGrid button.on{border-color:var(--pri);background:linear-gradient(135deg,rgba(154,127,188,.18),rgba(206,147,171,.18));transform:scale(1.05)}
.moodLabel{margin-top:9px;font-size:12.5px;color:var(--mut);min-height:18px}
.thumbRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
.thumbRow img,.thumbRow .addph{
  width:70px;height:70px;object-fit:cover;border-radius:13px;border:1px solid var(--line);
}
.thumbRow .addph{display:grid;place-items:center;font-size:24px;color:var(--mut);background:var(--card2);cursor:pointer}
.taskRow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line)}
.taskRow:last-child{border-bottom:none}
.cbx{flex:none;width:22px;height:22px;border-radius:50%;border:1.8px solid var(--faint);display:grid;place-items:center;color:transparent}
.cbx.done{background:var(--ok);border-color:var(--ok);color:#fff}
.taskRow .tt{flex:1;font-size:14px}
.taskRow .tt.done{text-decoration:line-through;color:var(--mut)}
.delx{flex:none;color:var(--faint);font-size:16px;padding:2px 6px}
.quoteBox{padding:6px 2px 2px}
.quoteBox .qt{font-size:15.5px;line-height:1.75;font-weight:500}
.quoteBox .qa{margin-top:8px;font-size:12px;color:var(--mut);display:flex;align-items:center;gap:8px}

/* ============ 记录页 ============ */
.statRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:2px}
.statBox{background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.statBox b{font-size:22px;color:var(--pri-deep);display:block;line-height:1.25}
.statBox span{font-size:11.5px;color:var(--mut)}
.ringwrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ringsvg{position:relative;width:86px;height:86px}
.ringsvg svg{transform:rotate(-90deg)}
.ringsvg .txt{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--pri-deep)}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;overflow-x:auto;padding:2px 2px 6px}
.hm i{width:13px;height:13px;border-radius:3.5px;background:rgba(143,118,173,.07)}
.hm i.l1{background:#E7D8E4}.hm i.l2{background:#D2BBD8}.hm i.l3{background:#B697CB}.hm i.l4{background:#9678B4}
html[data-theme="dark"] .hm i.l1{background:#4A3E52}html[data-theme="dark"] .hm i.l2{background:#5C4B66}
html[data-theme="dark"] .hm i.l3{background:#75608A}html[data-theme="dark"] .hm i.l4{background:#9678B4}
.hmlegend{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--mut)}
.hmlegend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.moodStrip{display:flex;gap:5px;overflow-x:auto;padding:4px 2px 2px}
.moodStrip .d{flex:none;width:34px;text-align:center}
.moodStrip .e{width:34px;height:34px;border-radius:11px;background:var(--card2);display:grid;place-items:center;font-size:18px;margin-bottom:3px}
.moodStrip .n{font-size:10px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:9px;height:110px;padding:4px 2px 0}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bars .bar{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:linear-gradient(180deg,#B093C9,#D9A7BC);min-height:3px}
.bars .v{font-size:10px;color:var(--mut)}
.bars .n{font-size:10.5px;color:var(--mut)}
.galDay{font-size:12px;color:var(--mut);margin:12px 2px 7px;font-weight:600}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(min-width:900px){.gal{grid-template-columns:repeat(6,1fr)}}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:13px;border:1px solid var(--line);cursor:pointer}
.empty{padding:14px 4px;text-align:center;color:var(--faint);font-size:13px}

/* ============ 专注页 ============ */
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;justify-content:center}
.presets button{padding:7px 14px;border-radius:999px;font-size:13px;background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.presets button.on{background:linear-gradient(135deg,rgba(154,127,188,.2),rgba(206,147,171,.2));border-color:var(--pri);color:var(--pri-deep);font-weight:700}
.bigring{position:relative;width:210px;height:210px;margin:6px auto 4px}
.bigring svg{transform:rotate(-90deg)}
.bigring .txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.bigring .txt b{font-size:42px;font-weight:700;letter-spacing:1px;font-variant-numeric:tabular-nums}
.bigring .txt span{font-size:12.5px;color:var(--mut)}
#tMeta{text-align:center;min-height:20px;margin-bottom:12px}
#tStart{max-width:260px;margin:0 auto;display:block}
#restBanner{margin-top:14px;border-radius:16px;padding:13px 15px;background:var(--okbg);border:1px solid rgba(15,81,50,.25);font-size:13.5px}
html[data-theme="dark"] #restBanner{border-color:rgba(127,200,160,.3)}
#restBanner b{display:block;margin-bottom:8px}
.sessRow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:13.5px}
.sessRow:last-child{border-bottom:none}
.sessRow .sm{flex:1;color:var(--mut);font-size:12px}

/* ============ 笔记页 ============ */
#catRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.catp{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:13.5px;
  background:var(--card2);border:1px solid var(--line);color:var(--mut)}
.catp.on{background:linear-gradient(135deg,#9A7FBC,#CE93AB);color:#fff;border-color:transparent;font-weight:600;box-shadow:0 5px 14px rgba(150,110,160,.3)}
.catp .rn{font-size:11px;opacity:.75;padding:1px 3px}
#noteText{width:100%;min-height:92px;border-radius:14px;border:1px solid var(--line);background:var(--card2);
  padding:11px 13px;resize:vertical;margin-bottom:10px}
#noteText:focus{outline:2px solid rgba(143,118,173,.35)}
#noteSearch{width:100%;padding:9px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);margin:14px 0 4px}
#noteSearch:focus{outline:2px solid rgba(143,118,173,.35)}
.noteItem{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin-top:9px}
.noteItem .nt{white-space:pre-wrap;word-break:break-word;font-size:14px}
.noteItem .nm{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--mut)}
.noteItem .nm .delx{margin-left:auto}

/* ============ 计划页 ============ */
.pform{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:14px}
.pform input[type=text]{grid-column:1/-1;padding:10px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card2)}
.pform input[type=date]{padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--card2)}
.pform button{border-radius:12px;padding:8px 16px}
.pform label{font-size:11px;color:var(--mut);display:block;margin-bottom:3px}
.gantt{position:relative;padding:6px 0 2px}
.gtoday{position:absolute;top:0;bottom:4px;width:2px;background:rgba(176,87,95,.55);border-radius:2px;z-index:2}
.gtoday::after{content:"今天";position:absolute;top:-17px;left:-13px;font-size:10px;color:var(--warn)}
.grow{margin:9px 0}
.grow .gt{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:4px}
.grow .gt .gd{color:var(--mut);font-size:11px;margin-left:auto}
.gtrack{position:relative;height:24px;background:rgba(143,118,173,.08);border-radius:8px}
.gtrack>i{position:absolute;top:0;bottom:0;border-radius:8px;background:linear-gradient(135deg,#9A7FBC,#CE93AB);
  display:flex;align-items:center;padding:0 8px;font-size:11px;color:#fff;white-space:nowrap;overflow:hidden;min-width:8px}
.gtrack>i.done{opacity:.4}
.gtrack>i.pink{background:linear-gradient(135deg,#C08CA4,#D9B0C0)}
.psRow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line)}
.psRow:last-child{border:none}
.psRow .due{font-size:11px;color:var(--mut);white-space:nowrap}
.psRow .tt{flex:1;font-size:14px}
.psRow .tt.done{text-decoration:line-through;color:var(--mut)}
.progWrap{height:8px;border-radius:99px;background:rgba(143,118,173,.12);overflow:hidden;margin:2px 0 10px}
.progWrap i{display:block;height:100%;background:linear-gradient(90deg,#9A7FBC,#CE93AB);border-radius:99px;transition:width .3s}

/* ============ 底部导航 ============ */
nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,680px);z-index:40;
  display:flex;padding:7px 6px calc(7px + env(safe-area-inset-bottom));
  background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px;
  font-size:10.5px;color:var(--mut);border-radius:14px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--pri-deep);font-weight:700;background:rgba(143,118,173,.12)}
@media(min-width:900px){nav{width:min(100%,960px)}}

/* ============ 弹层 / 轻提示 / 灯箱 ============ */
#toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(8px);
  background:rgba(52,44,58,.93);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:90;
  opacity:0;pointer-events:none;transition:.25s;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#overlay{position:fixed;inset:0;z-index:60;background:rgba(30,25,35,.45);backdrop-filter:blur(3px);
  display:flex;align-items:flex-end;justify-content:center}
@media(min-width:768px){#overlay{align-items:center}}
#sheet{width:min(100%,520px);max-height:84dvh;overflow-y:auto;background:var(--bg0);border-radius:22px 22px 0 0;
  padding:18px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.18)}
@media(min-width:768px){#sheet{border-radius:22px;margin-bottom:8vh}}
#sheet h2{font-size:17px;display:flex;align-items:center;gap:8px;margin-bottom:14px}
#sheet h2 .x{margin-left:auto;font-size:20px;color:var(--mut);padding:2px 8px}
.frow{margin-bottom:13px}
.frow label{display:block;font-size:12px;color:var(--mut);margin-bottom:5px;font-weight:600}
.frow input[type=text],.frow input[type=date],.frow input[type=time],.frow input[type=number],.frow select{
  width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card2)}
.frow input:focus,.frow select:focus{outline:2px solid rgba(143,118,173,.35)}
.frow input[type=range]{width:100%}
.swrow{display:flex;align-items:center;justify-content:space-between;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:14px}
.swrow:last-child{border:none}
.sw{position:relative;width:46px;height:27px;border-radius:99px;background:var(--faint);transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.sw.on{background:#3C9463}
.sw.on::after{left:22px}
.locCard{border:1px solid var(--line);border-radius:15px;padding:11px 13px;margin-bottom:10px;background:var(--card2)}
.locCard .lt{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px}
.locCard .lt .delx{margin-left:auto}
.locCard .lm{font-size:11.5px;color:var(--mut);margin-top:3px}
.locCard .lbtns{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.hr{border:none;border-top:1px dashed var(--line);margin:16px 0}
#lightbox{position:fixed;inset:0;z-index:80;background:rgba(18,14,22,.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
#lightbox[hidden]{display:none}
#overlay[hidden]{display:none}
#lightbox img{max-width:94vw;max-height:76vh;border-radius:14px}
#lightbox .rowbtns{justify-content:center}
html[data-theme="dark"] #sheet{background:#2B2730}

/* ============ 奖励板块 ============ */
#starFab{position:fixed;right:16px;bottom:calc(92px + env(safe-area-inset-bottom));z-index:45;width:54px;height:54px;
  border-radius:50%;background:linear-gradient(135deg,#9A7FBC,#CE93AB);box-shadow:0 8px 22px rgba(150,110,160,.45);
  display:grid;place-items:center;transition:transform .15s}
#starFab:active{transform:scale(.88) rotate(-12deg)}
#starFab svg{width:27px;height:27px;color:#fff}
body.watch #starFab{display:none!important}
#walletCard{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,rgba(154,127,188,.18),rgba(206,147,171,.16))}
#walletCard .wEmo{font-size:42px;flex:none}
.walletNum{font-size:24px;font-weight:800;color:var(--pri-deep);line-height:1.3;font-variant-numeric:tabular-nums}
.walletSub{font-size:12px;color:var(--mut)}
.exRow{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px dashed var(--line);font-size:13.5px}
.exRow:last-child{border:none}
.exRow .info{flex:1;line-height:1.5}
.exRow .emo{font-size:24px;flex:none}

<script>
'use strict';
/* ================= 工具 ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const dayKey=t=>{const d=t?new Date(t):new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const addDays=(k,n)=>{const[y,m,d]=k.split('-').map(Number);const dt=new Date(y,m-1,d+n);return dayKey(dt.getTime())};
const diffDays=(k1,k2)=>{const p=s=>s.split('-').map(Number);const a=p(k1),b=p(k2);return Math.round((new Date(b[0],b[1]-1,b[2])-new Date(a[0],a[1]-1,a[2]))/864e5)};
const mmss=s=>{s=Math.max(0,s);const m=Math.floor(s/60);return pad(m)+':'+pad(Math.round(s%60))};
const WEEK=['周日','周一','周二','周三','周四','周五','周六'];

function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tid);t._tid=setTimeout(()=>t.classList.remove('show'),ms||2400)}

/* ================= 本地存储 ================= */
const LS={
  get(k,d){try{const v=localStorage.getItem('libpass.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('libpass.'+k,JSON.stringify(v))}catch(e){toast('存储失败:'+e.message)}},
  del(k){localStorage.removeItem('libpass.'+k)}
};
const S={
  settings:LS.get('settings',{examName:'目标考试',examDate:'',theme:'light',notifOn:false,notifGeo:true,
    notifTimes:['08:00','13:00','19:00'],keepAlive:true}),
  locs:LS.get('locs',[
    {id:'l1',name:'图书馆',lat:null,lng:null,r:200},
    {id:'l2',name:'教学楼',lat:null,lng:null,r:200},
    {id:'l3',name:'自习室',lat:null,lng:null,r:150}]),
  checkins:LS.get('checkins',[]),
  moods:LS.get('moods',[]),
  cats:LS.get('cats',[
    {id:'c1',icon:'⚖️',name:'行测'},{id:'c2',icon:'✍️',name:'申论'},
    {id:'c3',icon:'🧩',name:'错题'},{id:'c4',icon:'💡',name:'灵感'}]),
  notes:LS.get('notes',{}),
  plansL:LS.get('plansL',[]),
  plansS:LS.get('plansS',[]),
  focus:LS.get('focus',[]),
  reports:LS.get('reports',[]),
  rewards:LS.get('rewards',{candy:0,coins:0,coinsTotal:0,exCk:0,exMin:0,boxes:0,cards:[],txs:[],freeDay:'',popsDay:'',pops:0,
    orbs:{},constellations:{},dayBoxes:{day:'',n:0}}),
  seen:LS.get('seen',false)
};
let R=S.rewards;
if(!R.orbs)R.orbs={};if(!R.constellations)R.constellations={};if(!R.dayBoxes)R.dayBoxes={day:'',n:0};
if(!R.gardens)R.gardens=[];if(!R.pendingCons)R.pendingCons=[];
if(S.settings.keepAlive===undefined)S.settings.keepAlive=true;
/* 云同步:令牌与同步配置(每台设备独立授权),删除墓碑用于多端合并 */
let SYNCCFG=LS.get('syncCfg',null);     // {token,gistId,auto,lastAt,exam,cats,rew}
const DELLOG=LS.get('delLog',[]);       // [{c:集合名,g:分组键|null,id,ts}]
function tombstone(c,g,id){DELLOG.push({c,g,id,ts:Date.now()});if(DELLOG.length>400)DELLOG.splice(0,DELLOG.length-400);LS.set('delLog',DELLOG)}
function stampSync(k){if(SYNCCFG){SYNCCFG[k]=Date.now();LS.set('syncCfg',SYNCCFG)}}
let syncTid=0;
function scheduleSync(){if(SYNCCFG&&SYNCCFG.auto){clearTimeout(syncTid);syncTid=setTimeout(()=>syncNow(),5000)}}
const save=k=>{LS.set(k,S[k]);scheduleSync()};
const ui={tab:'today',noteCat:'c1',q:'',quote:0,photoIds:new Set()};

/* ================= 照片:IndexedDB ================= */
let PHOTOS=[]; // {id,ts,day,dataUrl}
function idbOpen(){return new Promise((res,rej)=>{
  const r=indexedDB.open('libpass',1);
  r.onupgradeneeded=()=>{r.result.createObjectStore('photos',{keyPath:'id'})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
})}
async function idbAll(){try{const db=await idbOpen();return await new Promise((res,rej)=>{
  const rq=db.transaction('photos').objectStore('photos').getAll();
  rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error)})}catch(e){return []}}
async function idbPut(p){try{const db=await idbOpen();await new Promise((res,rej)=>{
  const t=db.transaction('photos','readwrite');t.objectStore('photos').put(p);
  t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){toast('照片保存失败(隐私模式?)')}}
async function idbDel(id){try{const db=await idbOpen();await new Promise((res,rej)=>{
  const t=db.transaction('photos','readwrite');t.objectStore('photos').delete(id);
  t.oncomplete=res;t.onerror=()=>rej(t.error)})}catch(e){}}

/* ================= 主题 / 图标 / PWA ================= */
function applyTheme(){document.documentElement.dataset.theme=S.settings.theme;
  const mc=document.querySelectorAll('meta[name=theme-color]');mc.forEach(m=>m.remove());
  const m=document.createElement('meta');m.name='theme-color';
  m.content=S.settings.theme==='dark'?'#26232A':'#F2EFEA';document.head.appendChild(m);}
const GLYPH='M116 248 L248 280 L248 376 L116 344 Z M396 248 L264 280 L264 376 L396 344 Z M206.6 178.2 L241.4 205 L305 136.6 L327 157 L238.4 252.4 L185.4 199.4 Z';
function iconSVG(size){return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="'+size+'" height="'+size+'">'

/* ================= 打卡与定位 ================= */
let lastPos=null,geoWatchOn=false;
const REARTH=6371000;
function distM(la1,lo1,la2,lo2){const rad=Math.PI/180;
  const dLa=(la2-la1)*rad,dLo=(lo2-lo1)*rad;
  const a=Math.sin(dLa/2)**2+Math.cos(la1*rad)*Math.cos(la2*rad)*Math.sin(dLo/2)**2;
  return Math.round(2*REARTH*Math.asin(Math.sqrt(a)))}
function getPos(){return new Promise((res,rej)=>{
  if(!navigator.geolocation)return rej(new Error('此环境不支持定位'));
  navigator.geolocation.getCurrentPosition(p=>res(p.coords),e=>{
    rej(new Error(e.code===1?'定位权限被拒绝':e.code===3?'定位超时':'定位失败'))},
    {enableHighAccuracy:true,timeout:9000,maximumAge:20000})})}
function nearestLoc(coords){
  let best=null;
  for(const l of S.locs){if(l.lat==null)continue;
    const d=distM(coords.latitude,coords.longitude,l.lat,l.lng);
    if(!best||d<best.d)best={loc:l,d};}
  return best}
function todayCheckin(){const k=dayKey();return S.checkins.filter(c=>c.day===k)}
function calcStreak(){const set=new Set(S.checkins.map(c=>c.day));
  let cur=0,d=dayKey();if(!set.has(d))d=addDays(d,-1);
  while(set.has(d)){cur++;d=addDays(d,-1)}
  return{cur,total:set.size}}
async function doCheckin(){
  const k=dayKey();
  const already=S.checkins.filter(c=>c.day===k);
  const sel=$('#locSel')?$('#locSel').value:'';
  try{
    var coords=await getPos();lastPos=coords;
  }catch(e){coords=null}
  let loc=null,dist=null,src='manual';
  if(coords){
    const nb=nearestLoc(coords);
    if(nb&&nb.d<=nb.loc.r){loc=nb.loc;dist=nb.d;src='gps'}
    else{
      const nearTxt=nb?('距离最近的「'+nb.loc.name+'」约 '+nb.d+' 米'):'尚未设置任何地点坐标';
      const name=sel?S.locs.find(l=>l.id===sel)?.name:'';
      if(confirm('当前不在打卡范围内('+nearTxt+')。\n'+(name?('仍要在「'+name+'」打卡吗?'):'仍要手动打卡吗?'))){
        loc=(sel?S.locs.find(l=>l.id===sel):null)||{name:'手动打卡'};src='manual-out';
      }else{renderToday();return}
    }
  }else{
    if(!sel){toast('定位不可用,请先在下方选择地点');renderToday();return}
    loc=S.locs.find(l=>l.id===sel)||{name:'手动打卡'};
    const ok=confirm('定位不可用,将在「'+loc.name+'」手动打卡,继续吗?');
    if(!ok){renderToday();return}
  }
  S.checkins.push({id:uid(),ts:Date.now(),day:k,locId:loc.id||'',locName:loc.name,
    dist:dist,src:src,lat:coords?+coords.latitude.toFixed(5):null,lng:coords?+coords.longitude.toFixed(5):null});
  save('checkins');toast('✅ 打卡成功 · '+loc.name);
  if(document.body.classList.contains('watch'))updateWatchBtn();
  renderHeader();renderToday();renderRecords();
  maybePop(0.35);
}

async function handlePhotos(files){
  for(const f of files){
    if(!f.type.startsWith('image/'))continue;
    try{
      const url=await compress(f);
      const rec={id:uid(),ts:Date.now(),day:dayKey(),dataUrl:url};
      await idbPut(rec);PHOTOS.push(rec);ui.photoIds.add(rec.id);
    }catch(e){toast('照片处理失败')}
  }
  toast('📷 已保存到本机相册(应用内)');
  renderToday();renderRecords();
}
function compress(file){return new Promise((res,rej)=>{
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const max=1280;let{width:w,height:h}=img;
    if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode fail'))};
  img.src=url})}

function makeSilentWav(){
  const sr=8000,n=sr/2;const buf=new ArrayBuffer(44+n*2);const v=new DataView(buf);
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
  v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++)v.setInt16(44+i*2,(i%20<10)?2:-2,true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}

      navigator.mediaSession.setActionHandler('play',()=>{})}catch(e){}
  }
}

/* 小折线图助手 */
function polyChart(labels,series,opts){
  opts=opts||{};const W=opts.w||330,H=opts.h||128,L=24,R=6,T=10,B=18;
  const iw=W-L-R,ih=H-T-B;
  let maxV=1;series.forEach(s=>s.v.forEach(v=>{if(v>maxV)maxV=v}));
  const n=labels.length;
  const X=i=>n<=1?L+iw/2:L+i*iw/Math.max(1,n-1);
  const Y=v=>T+ih-(v/maxV)*ih;
  let out='<svg viewBox="0 0 '+W+' '+H+'">';
  [1,2].forEach(g=>{const y=(T+ih*g/3).toFixed(1);
    out+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'" stroke="rgba(143,118,173,.14)" stroke-width="1"/>'});
  labels.forEach((lb,i)=>{if(n>8&&i%2)return;
    out+='<text x="'+X(i).toFixed(1)+'" y="'+(H-5)+'" font-size="8.5" fill="#8A8089" text-anchor="middle">'+esc(lb)+'</text>'});
  series.forEach(s=>{
    const pts=s.v.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
    out+='<polyline points="'+pts+'" fill="none" stroke="'+s.c+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="4 3"':'')+'/>';
    s.v.forEach((v,i)=>{out+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(v).toFixed(1)+'" r="2.3" fill="'+s.c+'"/>'})});
  return '<div class="chartWrap">'+out+'</svg></div>';
}

function renderPlans(){
  // 长期:甘特双线
  const g=$('#gantt');
  if(!S.plansL.length){
    g.innerHTML='<div class="empty">还没有长期目标。比如:「行测一轮复习 10-10 ~ 12-20」<br><span class="mut small">完成时,会长出一张属于你的温柔战报 💌</span></div>';
  }else{
    let lo=S.plansL.map(p=>p.start).reduce((a,b)=>a<b?a:b),hi=S.plansL.map(p=>p.end).reduce((a,b)=>a>b?a:b);
    lo=addDays(lo,-5);hi=addDays(hi,5);
    if(diffDays(lo,hi)<30)hi=addDays(lo,30);
    const pos=d=>Math.max(0,Math.min(100,(diffDays(lo,d)/diffDays(lo,hi))*100));
    const todayP=pos(dayKey());
    const rows=[...S.plansL].sort((a,b)=>a.start<b.start?-1:1).map(p=>{
      const l=pos(p.start),w=Math.max(4,pos(p.end)-l);
      return `<div class="grow">
        <div class="gt"><button class="cbx ${p.done?'done':''}" data-act="planL-toggle" data-id="${p.id}">✓</button>
        <span style="${p.done?'text-decoration:line-through;color:var(--mut)':''}">${esc(p.title)}</span>
        <span class="gd">${p.start} ~ ${p.end}</span>
        <button class="delx" data-act="planL-del" data-id="${p.id}">✕</button></div>
        <div class="gtrack"><i class="${p.done?'done':''}" style="left:${l}%;width:${w}%"></i></div></div>`}).join('');
    g.innerHTML=`<div class="gantt"><div class="gtoday" style="left:${todayP}%"></div>${rows}</div>
    <div class="mut small" style="margin-top:8px">竖线为今天 · 点圆圈标记完成,会收到一张温柔战报 💌</div>`;
  }
  // 短期任务清单
  const list=[...S.plansS].sort((a,b)=>(a.done-b.done)||(a.due<b.due?-1:1));
  const k=dayKey();
  const all=S.plansS,dn=all.filter(p=>p.done).length;
  const pct=all.length?Math.round(dn/all.length*100):0;
  const qcolor={q1:'#B0575F',q2:'#8F76AD',q3:'#C08CA4',q4:'#7C9A6A'};
  $('#planSStats').innerHTML=all.length?`<div class="mut small" style="margin-bottom:6px">完成率 ${dn}/${all.length}</div><div class="progWrap"><i style="width:${pct}%"></i></div>`:'';
  $('#planSList').innerHTML=list.length?list.map(p=>{
    const over=!p.done&&p.due<k;
    const qc=qcolor[p.qid||'q1'];
    return `<div class="psRow">
      <i style="flex:none;width:8px;height:8px;border-radius:3px;background:${qc}" title="${esc((S.quads.find(q=>q.id===(p.qid||'q1'))||{}).name||'')}"></i>
      <button class="cbx ${p.done?'done':''}" data-act="planS-toggle" data-id="${p.id}">✓</button>
      <span class="tt ${p.done?'done':''}">${esc(p.title)}</span>
      ${over?'<span class="chip warn">逾期</span><button class="btn-ghost" style="padding:4px 9px;font-size:12px" data-act="postpone" data-id="'+p.id+'">顺延</button>':''}
      <span class="due">${p.due===k?'今天':esc(p.due)}</span>
      <button class="delx" data-act="planS-del" data-id="${p.id}">✕</button></div>`}).join('')
    :'<div class="empty">还没有短期任务,添加一条今天的吧</div>';
  renderRhythm();renderQuads();
}

async function doExport(withPhotos){
  const data={v:1,exportedAt:new Date().toISOString(),
    settings:S.settings,locs:S.locs,checkins:S.checkins,moods:S.moods,
    cats:S.cats,notes:S.notes,plansL:S.plansL,plansS:S.plansS,focus:S.focus,rewards:S.rewards,reports:S.reports||[],quads:S.quads||DEF_QUADS};

function doImport(file){
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result);
    if(!d||typeof d!=='object')throw new Error('格式错误');
    if(!confirm('导入将覆盖本机当前数据,继续吗?'))return;
    const map=['settings','locs','checkins','moods','cats','notes','plansL','plansS','focus','rewards','reports'];
    for(const key of map)if(d[key]!=null){S[key]=d[key];LS.set(key,S[key])}
    if(d.quads){S.quads=d.quads;LS.set('quads',S.quads)}
    const put=(d.photos||[]).map(p=>idbPut(p));
    Promise.all(put).then(()=>{toast('✅ 导入完成,即将刷新');setTimeout(()=>location.reload(),900)});
  }catch(e){toast('导入失败:'+e.message)}};
  r.readAsText(file)}
async function doWipe(){
  if(!confirm('确定清空全部数据吗?此操作不可恢复(建议先导出备份)。'))return;
  if(!confirm('再次确认:真的要清空吗?'))return;
  Object.keys(localStorage).filter(k=>k.startsWith('libpass.')).forEach(k=>localStorage.removeItem(k));
  try{indexedDB.deleteDatabase('libpass')}catch(e){}
  toast('已清空,即将刷新');setTimeout(()=>location.reload(),900)}

const fired=new Set();
function notify(title,body){
  try{if('Notification'in window&&Notification.permission==='granted')new Notification(title,{body})}
  catch(e){}
  toast(title+' · '+body,3600)}
function checkReminders(){
  if(!S.settings.notifOn)return;
  const now=new Date(),cur=pad(now.getHours())+':'+pad(now.getMinutes()),k=dayKey();
  if(todayCheckin().length)return;
  (S.settings.notifTimes||[]).forEach(t=>{
    if(t&&t===cur&&!fired.has(k+t)){fired.add(k+t);
      notify('LibPass 备考打卡','到点了,该入座学习啦 📖')}})}

let geoTimer=0;
function startGeoWatch(){
  if(geoWatchOn||!navigator.geolocation)return;
  if(!S.settings.notifGeo)return;
  geoWatchOn=true;
  setInterval(async()=>{
    if(document.hidden)return;
    try{const c=await getPos();lastPos=c;
      if(ui.tab==='today')renderToday();
      if(todayCheckin().length)return;
      const nb=nearestLoc(c);
      const k=dayKey();
      if(nb&&nb.d<=nb.loc.r&&!fired.has(k+'geo')){
        fired.add(k+'geo');
        notify('你已到达「'+nb.loc.name+'」','记得打卡哦 ✅')}}
    catch(e){}},60000);
}

function todaySeries(){
  const m=S.moods.find(x=>x.day===dayKey());
  return (m&&MOOD2SERIES[m.e])||'magic'}
function orbTotal(){return Object.values(R.orbs).reduce((a,arr)=>a+arr.length,0)}
function dayBoxLeft(){
  const k=dayKey();
  if(R.dayBoxes.day!==k){R.dayBoxes={day:k,n:0}}
  return Math.max(0,BOX_PER_DAY-R.dayBoxes.n)}
function rollReward(){
  const r=Math.random();
  if(r<0.24){
    const un=CARDS.filter(c=>!R.cards.includes(c.id));
    if(un.length){const c=un[Math.floor(Math.random()*un.length)];return{type:'card',card:c}}
  }
  if(r<0.62){ // 情绪小球(按当日心情定系列;集满则折金币)
    const sk=todaySeries(),own=R.orbs[sk]||[],all=SERIES[sk].ors;
    const left=all.map((o,i)=>i).filter(i=>!own.includes(i));
    if(left.length)return{type:'orb',sk,oi:left[Math.floor(Math.random()*left.length)],fresh:true};
    return{type:'coins',n:12+Math.floor(Math.random()*20)};
  }
  if(r<0.82)return{type:'candy',n:5+Math.floor(Math.random()*12)};
  if(r<0.97)return{type:'coins',n:5+Math.floor(Math.random()*36)};
  return{type:'coins',n:88,jackpot:true};
}

/* --- 星座解锁:集齐科目考点卡(双鱼座=合成一次情绪花园);每月最多点亮一个 --- */
function consEligible(c){
  if(c.byGarden)return R.gardens.length>0;
  return c.cards.length>0&&c.cards.every(id=>R.cards.includes(id))}
function canUnlockNow(){return !R.lastConsAt||Date.now()-R.lastConsAt>=30*864e5}
function checkConstellations(){
  // 先处理等待中的(满 30 天即点亮)
  for(let i=R.pendingCons.length-1;i>=0;i--){
    if(canUnlockNow()){const id=R.pendingCons.splice(i,1)[0];
      R.constellations[id]=Date.now();R.lastConsAt=Date.now();
      const c=CONSTELLATIONS.find(x=>x.id===id);
      if(c)toast(c.star+' 点亮星座:'+c.name)}}
  // 新满足条件的:能点则点,否则排队
  CONSTELLATIONS.forEach(c=>{
    if(R.constellations[c.id]||R.pendingCons.includes(c.id))return;
    if(!consEligible(c))return;
    if(canUnlockNow()){R.constellations[c.id]=Date.now();R.lastConsAt=Date.now();
      toast(c.star+' 点亮星座:'+c.name)}
    else R.pendingCons.push(c.id)});
  if(R.pendingCons.length)toast('又有星座在等下一个月圆之夜 ✨');
  saveR();
}

function synthGarden(){
  let need=GARDEN_COST;
  const take={};
  for(const sk of Object.keys(R.orbs)){
    while(need>0&&R.orbs[sk].length>0){(take[sk]=take[sk]||[]).push(R.orbs[sk].pop());need--}}
  if(need>0){toast('小球还不够,先去开两个盲盒吧');return}
  const fl=[...GARDEN_FLOWERS].sort(()=>Math.random()-.5).slice(0,4+Math.min(3,R.gardens.length));
  R.gardens.push({id:uid(),ts:Date.now(),flowers:fl,from:Object.keys(take).map(sk=>SERIES[sk].name)});
  txLog('合成情绪花园 ×1','🌷');saveR();

}

function starMapSVG(){
  // 最近 45 天:每个打卡日点亮一颗小星,位置由日期哈希确定
  const W=340,H=150,k=dayKey();
  const lit=new Set(S.checkins.map(c=>c.day));
  let dots='';
  for(let i=44;i>=0;i--){
    const d=addDays(k,-i);if(!lit.has(d))continue;
    let h=0;for(const ch of d)h=(h*31+ch.charCodeAt(0))>>>0;
    const x=12+(h%47)/47*(W-26),y=14+((h>>5)%41)/41*(H-30);
    const big=(i===0);
    dots+='<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(big?3.4:2)+'" fill="#EDE7F6" opacity="'+(big?1:.85)+'" class="twinkle" style="animation-delay:'+((h%30)/10)+'s"/>';
  }
  const streak=calcStreak().cur;
  return '<div class="starMap" style="background:linear-gradient(160deg,#2E2740,#4A3B5C 55%,#5E4666)">'+
    '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid slice">'+dots+'</svg></div>'+
    '<div class="mut small" style="margin-top:6px">星图已点亮 '+lit.size+' 天的星星 · 当前连续 '+streak+' 天 🔥</div>';
}

const GIST_DESC='LibPass Sync (do not edit)';
const SYNC_HELP='照片不参与同步(留在各设备本机);其余数据全量同步。令牌仅保存在本机,可在 GitHub 随时撤销。';
async function ghApi(method,path,body){
  const r=await fetch('https://api.github.com'+path,{method,
    headers:{'Authorization':'Bearer '+SYNCCFG.token,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body:body?JSON.stringify(body):undefined});
  if(!r.ok)throw new Error('GitHub '+r.status+(r.status===401?'(令牌失效,请重新连接)':''));
  return r.json()}
function collectSync(){return {app:'libpass-sync',v:1,at:Date.now(),
  data:{checkins:S.checkins,moods:S.moods,cats:S.cats,notes:S.notes,plansL:S.plansL,plansS:S.plansS,
        focus:S.focus,rewards:S.rewards,locs:S.locs,reports:S.reports||[],quads:S.quads||DEF_QUADS,
        exam:{examName:S.settings.examName,examDate:S.settings.examDate,theme:S.settings.theme}},
  del:DELLOG}}
function applyMerge(rd,remoteAt){
  // 1) 墓碑并集
  (rd.del||[]).forEach(t=>{const cur=DELLOG.find(x=>x.c===t.c&&(x.g||null)===(t.g||null)&&x.id===t.id);
    if(!cur)DELLOG.push(t);else if(t.ts>cur.ts)cur.ts=t.ts});
  LS.set('delLog',DELLOG);
  const alive=(c,g,id,its)=>{const t=DELLOG.find(x=>x.c===c&&(x.g||null)===(g||null)&&x.id===id);return !(t&&t.ts>=(its||0))};
  // 2) 追加型集合:按 id 并集(本地与远端条目都需通过墓碑检查)
  const union=(lname,key)=>{const map={};
    S[lname].forEach(x=>{if(x.id&&alive(key,null,x.id,x.ts||0))map[x.id]=x});
    (rd.data[key]||[]).forEach(x=>{if(!x.id||map[x.id])return;if(alive(key,null,x.id,x.ts||0))map[x.id]=x});
    S[lname]=Object.values(map);LS.set(lname,S[lname])};
  union('checkins','checkins');union('focus','focus');
  union('plansL','plansL');union('plansS','plansS');union('locs','locs');union('reports','reports');
  // 3) 心态:按天,新者胜
  const mm={};S.moods.forEach(m=>mm[m.day]=m);
  (rd.data.moods||[]).forEach(m=>{if(!mm[m.day]||m.ts>mm[m.day].ts)mm[m.day]=m});
  S.moods=Object.values(mm);LS.set('moods',S.moods);
  // 4) 笔记:按分类列表,按 id 并集
  const rn=rd.data.notes||{};const out={};
  new Set([...Object.keys(S.notes),...Object.keys(rn)]).forEach(cid=>{
    const map={};(S.notes[cid]||[]).forEach(n=>{if(alive('notes',cid,n.id,n.ts||0))map[n.id]=n});
    (rn[cid]||[]).forEach(n=>{if(map[n.id])return;if(alive('notes',cid,n.id,n.ts||0))map[n.id]=n});
    out[cid]=Object.values(map)});
  S.notes=out;LS.set('notes',S.notes);
  // 5) 设置级数据:按最后修改时间 LWW
  if(remoteAt>(SYNCCFG.exam||0)&&rd.data.exam){S.settings.examName=rd.data.exam.examName||S.settings.examName;
    S.settings.examDate=rd.data.exam.examDate||'';S.settings.theme=rd.data.exam.theme||S.settings.theme;
    SYNCCFG.exam=remoteAt;LS.set('settings',S.settings)}
  if(remoteAt>(SYNCCFG.cats||0)&&rd.data.cats){S.cats=rd.data.cats;SYNCCFG.cats=remoteAt;LS.set('cats',S.cats)}
  if(remoteAt>(SYNCCFG.quads||0)&&rd.data.quads){S.quads=rd.data.quads;SYNCCFG.quads=remoteAt;LS.set('quads',S.quads)}
  if(remoteAt>(SYNCCFG.rew||0)&&rd.data.rewards){S.rewards=rd.data.rewards;R=S.rewards;SYNCCFG.rew=remoteAt;LS.set('rewards',S.rewards)}
}
async function syncNow(){
  if(!SYNCCFG)return;
  try{
    let gist=SYNCCFG.gistId?await ghApi('GET','/gists/'+SYNCCFG.gistId):null;
    if(!gist||(gist.files&&!gist.files['libpass-data.json'])){
      const list=await ghApi('GET','/gists?per_page=100');
      const found=(Array.isArray(list)?list:[]).find(g=>g.description===GIST_DESC);
      if(found){SYNCCFG.gistId=found.id;LS.set('syncCfg',SYNCCFG);gist=await ghApi('GET','/gists/'+found.id)}
      else{gist=await ghApi('POST','/gists',{description:GIST_DESC,public:false,
        files:{'libpass-data.json':{content:JSON.stringify(collectSync())}}});
        SYNCCFG.gistId=gist.id;LS.set('syncCfg',SYNCCFG)}
    }
    const file=gist.files&&gist.files['libpass-data.json'];
    let remote=null;
    if(file&&file.content){try{remote=JSON.parse(file.content)}catch(e){}}
    let changed=false;
    if(remote&&remote.app==='libpass-sync'){applyMerge(remote,remote.at);changed=true}
    await ghApi('PATCH','/gists/'+SYNCCFG.gistId,{files:{'libpass-data.json':{content:JSON.stringify(collectSync())}}});
    SYNCCFG.lastAt=Date.now();LS.set('syncCfg',SYNCCFG);
    toast('☁️ 已同步'+(changed?' · 已合并云端数据':'')+' · '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}));
    renderHeader();renderTab(ui.tab);
    if($('#syncBox'))renderSyncBox();
  }catch(e){toast('同步失败:'+(e.message||e))}
}

      已为你打开 GitHub 令牌创建页(权限已预填,只需拉到最底点 <b>Generate token</b>)。<br>
      1️⃣ 在 GitHub 页面点绿色按钮生成令牌<br>
      2️⃣ 点复制按钮,把 <b>ghp_</b> 开头的令牌粘贴到这里<br>
      3️⃣ 每台设备各连一次,之后自动同步
    </div>
    <form id="syncForm"><div class="frow"><label>粘贴令牌(ghp_ 开头)</label>
      <input type="text" id="tokenPaste" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" required></div>
      <button class="btn-main" type="submit">连接并同步</button>
      <div class="mut small" style="margin-top:9px">${SYNC_HELP}</div></form>`);
  $('#syncForm').onsubmit=async e=>{e.preventDefault();
    const tok=$('#tokenPaste').value.trim();
    if(!tok){toast('请先粘贴令牌');return}
    toast('正在验证令牌…');
    try{
      const r=await fetch('https://api.github.com/gists?per_page=1',{headers:{Authorization:'Bearer '+tok}});
      if(!r.ok)throw new Error('令牌无效或未勾选 gist 权限');
      SYNCCFG={token:tok,gistId:null,auto:true,lastAt:0,exam:0,cats:0,rew:0};LS.set('syncCfg',SYNCCFG);
      closeSheet();await syncNow();openSettings();
    }catch(err){toast('连接失败:'+err.message)}};
}
function renderSyncBox(){
  const box=$('#syncBox');if(!box)return;
  if(!SYNCCFG){
    box.innerHTML='<div class="mut small" style="margin-bottom:8px">'+SYNC_HELP+'</div>'+
      '<div class="rowbtns"><button class="btn-main sm" data-act="sync-connect">🔗 连接云端</button></div>';
  }else{
    box.innerHTML='<div class="mut small" style="margin-bottom:8px">✅ 已连接 · 上次同步 '+
      (SYNCCFG.lastAt?new Date(SYNCCFG.lastAt).toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'刚连接')+
      '</div><div class="rowbtns"><button class="btn-ghost" data-act="sync-now">立即同步</button>'+
      '<button class="btn-ghost btn-danger" data-act="sync-disconnect">断开</button></div>'+
      '<div class="swrow" style="margin-top:8px"><span>自动同步(改动后约 5 秒)</span><button class="sw '+(SYNCCFG.auto?'on':'')+'" data-act="set-autosync"></button></div>';
  }
}

/* ================= 弹层 ================= */
function openSheet(title,html){
  $('#sheet').innerHTML='<h2>'+esc(title)+'<button class="x" data-act="sheet-close" aria-label="关闭">✕</button></h2>'+html;
  $('#overlay').hidden=false}
function closeSheet(){$('#overlay').hidden=true}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeSheet()});

/* ================= 事件总线 ================= */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act,id=a.dataset.id;
  switch(act){
    case 'nav':go(a.dataset.tab);break;
    case 'checkin':doCheckin();break;
    case 'firstfix':firstFix();break;
    case 'mood':setMood(a.dataset.e,a.dataset.l);break;
    case 'quote-next':{let i;do{i=Math.floor(Math.random()*QUOTES.length)}while(i===ui.quote&&QUOTES.length>1);ui.quote=i;go('today');break}
    case 'photo-open':openLightbox(id);break;
    case 'lb-close':$('#lightbox').hidden=true;break;
    case 'photo-del':(async()=>{await idbDel(id);PHOTOS=PHOTOS.filter(p=>p.id!==id);
      $('#lightbox').hidden=true;toast('已删除');renderToday();renderRecords()})();break;
    case 'photo-cap':{(async()=>{const p=PHOTOS.find(x=>x.id===id);if(!p)return;
      p.cap=$('#capInput')?$('#capInput').value.trim():'';await idbPut(p);
      $('#lightbox').hidden=true;toast('📝 这句话已经和照片放在一起了');renderToday();renderRecords()})();break}
    case 'task-toggle':case 'planS-toggle':{
      const p=S.plansS.find(x=>x.id===id);if(p){p.done=!p.done;save('plansS');
        if(p.done)toast('✅ 完成!干得漂亮');renderTab(ui.tab)}break}
    case 'postpone':{
      const p=S.plansS.find(x=>x.id===id);if(p){p.due=dayKey();save('plansS');
        toast('已顺延到今天');renderTab(ui.tab)}break}
    case 'quad-open':openQuad(id);break;
    case 'planL-toggle':{
      const p=S.plansL.find(x=>x.id===id);if(!p)break;
      p.done=!p.done;save('plansL');renderPlans();
      if(p.done)openReport(p);break}
    case 'report-save':{const w=window._rm;if(!w)break;
      const moment=$('#rmInput')?$('#rmInput').value.trim():'';
      S.reports.push({id:uid(),planId:w.p.id,title:w.p.title,start:w.p.start,end:w.p.end,
        sentence:w.sen,moment:moment||w.mom,ts:Date.now()});
      save('reports');window._rm=null;closeSheet();
      toast('💌 战报已收进册子');break}
    case 'planL-del':{if(confirm('删除这个长期目标?')){S.plansL=S.plansL.filter(x=>x.id!==id);tombstone('plansL',null,id);save('plansL');renderPlans()}break}
    case 'planS-del':{if(confirm('删除这个任务?')){S.plansS=S.plansS.filter(x=>x.id!==id);tombstone('plansS',null,id);save('plansS');renderTab(ui.tab)}break}
    case 'note-cat':ui.noteCat=id;ui.q='';$('#noteSearch').value='';renderNotes();break;
    case 'note-rename':renameCat();break;
    case 'note-del':{ if(confirm('删除这条笔记?')){S.notes[a.dataset.cat]=(S.notes[a.dataset.cat]||[]).filter(n=>n.id!==id);tombstone('notes',a.dataset.cat,id);save('notes');renderNotes()}break}
    case 'focus-start':focusStart();break;
    case 'focus-end':focusEnd();break;
    case 'rate':applyRating(a.dataset.k);break;
    case 'open-settings':openSettings();break;
    case 'open-locs':openLocs();break;
    case 'sheet-close':closeSheet();break;
    case 'loc-del':{if(confirm('删除该地点?')){S.locs=S.locs.filter(l=>l.id!==id);tombstone('locs',null,id);save('locs');openLocs();renderToday()}break}
    case 'export':doExport(false);break;
    case 'export-ph':doExport(true);break;
    case 'import':$('#importInput').click();break;
    case 'wipe':doWipe();break;
    case 'watch-open':closeSheet();enterWatch();break;
    case 'watch-close':exitWatch();break;
    case 'ex-ck':{const n=availCk();if(!n)break;
      R.exCk+=n;addCandy(n*10,'打卡兑换 ×'+n);toast('🍬 兑换了 '+n*10+' 颗糖果');renderRewards();break}
    case 'box-free':{const k2=dayKey();
      if(R.freeDay===k2||dayBoxLeft()<=0)break;
      R.freeDay=k2;saveR();showBox();break}
    case 'box-buy':{if(R.candy<BOX_PRICE||dayBoxLeft()<=0)break;
      R.candy-=BOX_PRICE;txLog('开盲盒','-'+BOX_PRICE+' 🍬');saveR();showBox();break}
    case 'box-open':openBoxAnim();break;
    case 'box-collect':collectBox();break;
    case 'garden-synth':synthGarden();break;
    case 'set-autosync':{if(!SYNCCFG)break;
      SYNCCFG.auto=!SYNCCFG.auto;LS.set('syncCfg',SYNCCFG);
      a.classList.toggle('on',SYNCCFG.auto);break}
    case 'set-keepalive':{S.settings.keepAlive=!S.settings.keepAlive;save('settings');
      a.classList.toggle('on',S.settings.keepAlive);
      if(!S.settings.keepAlive&&T.run)kaStop(true);break}
    case 'sync-connect':syncConnectFlow();break;
    case 'sync-now':{if(!SYNCCFG)break;toast('正在同步…');syncNow();break}
    case 'sync-disconnect':{if(!SYNCCFG)break;
      if(confirm('断开云同步?本机数据不受影响,云端备份会保留。')){
        SYNCCFG=null;LS.set('syncCfg',null);renderSyncBox();toast('已断开云同步')}break}
    case 'wmood':{const btn=a;setMood(btn.dataset.e,btn.dataset.l);
      $$('#wmood button').forEach(b=>b.classList.toggle('on',b.dataset.e===btn.dataset.e));break}
  }
});
$('#photoInput').addEventListener('change',e=>{
  const files=[...e.target.files];e.target.value='';
  if(files.length)handlePhotos(files)});
$('#importInput').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';
  if(f)doImport(f)});
$('#noteForm').addEventListener('submit',e=>{e.preventDefault();addNote()});
$('#noteSearch').addEventListener('input',e=>{ui.q=e.target.value;renderNotes()});
$('#noteText').addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();addNote()}});
$('#planLForm').addEventListener('submit',e=>{e.preventDefault();
  const title=$('#plTitle').value.trim(),st=$('#plStart').value,en=$('#plEnd').value;
  if(!title||!st||!en)return;
  if(en<st){toast('结束日期要晚于开始日期哦');return}
  S.plansL.push({id:uid(),title,start:st,end:en,done:false});
  save('plansL');$('#plTitle').value='';renderPlans();toast('🎯 长期目标已加入时间轴')});
$('#planSForm').addEventListener('submit',e=>{e.preventDefault();
  const title=$('#psTitle').value.trim(),due=$('#psDue').value;
  if(!title||!due)return;
  const qid=($('#psQuad')&&$('#psQuad').value)||'q1';
  S.plansS.push({id:uid(),title,due,done:false,qid});
  save('plansS');$('#psTitle').value='';renderPlans();toast('🗓️ 已放进宫格:『'+((S.quads.find(q=>q.id===qid)||{}).name||'')+'』')});

/* ================= 手表视图 ================= */
function enterWatch(){
  document.body.classList.add('watch');$('#wcard').style.display='flex';
  const d=new Date();
  $('#wdate').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 · '+WEEK[d.getDay()];
  const st=calcStreak();$('#wstreak').textContent=st.cur;
  const{examName,examDate}=S.settings;
  $('#wcd').textContent=examDate?('距'+examName+' '+Math.max(0,diffDays(dayKey(),examDate))+' 天'):'LibPass';
  const k=dayKey();const mood=S.moods.find(m=>m.day===k);
  $('#wmood').innerHTML=EMOJIS.slice(0,4).map(([e,l])=>
    `<button data-act="wmood" data-e="${e}" data-l="${esc(l)}" class="${mood&&mood.e===e?'on':''}">${e}</button>`).join('');
  updateWatchBtn()}
function updateWatchBtn(){
  const b=$('#wcard .wbtn');if(!b)return;
  const ck=todayCheckin().length;
  b.disabled=!!ck;b.textContent=ck?'已打卡 ✓':'打 卡'}
function exitWatch(){
  document.body.classList.remove('watch');$('#wcard').style.display='none';
  $('#starFab').style.display=(ui.tab==='today'?'grid':'none');
  history.replaceState(null,'',location.pathname);
  renderToday()}

/* ================= 欢迎 ================= */
function welcome(){
  openSheet('欢迎使用 LibPass 💜',`
    <div style="font-size:14px;line-height:2">
      这是一款<b>单文件、离线、数据全在本机</b>的备考打卡应用:<br>
      🏛️ <b>定位打卡</b> — 到图书馆/教学楼/自习室自动识别,入座即打卡<br>
      📷🎭 — 拍照存档 + 表情记录每天的心态<br>
      📓 — 四个可重命名的分类笔记<br>
      🎯🗓️ — 长期目标 + 短期任务双线时间轴<br>
      ⏳ — 专注打卡:放下手机,回来诚实地打个分就有糖果<br>
      🧠 — 每天一句励志/搞怪语(内置 144 句)<br>
      ⭐ — 游戏化激励:打卡/专注换糖果,开盲盒,金币银行,集考点卡<br><br>
      <span class="mut small">建议:先到 ⚙️ 设置考试日期,再到「地点管理」用当前位置校准你的自习地点。</span>
    </div>
    <button class="btn-main" data-act="sheet-close" style="margin-top:14px">开始使用</button>`);
}

/* ================= 初始化 ================= */
async function init(){
  applyTheme();
  setupIcons();
  ui.quote=dailyQuoteIdx();
  renderHeader();
  go('today');
  PHOTOS=await idbAll();
  renderHeader();renderToday();renderRecords();renderFocus();renderNotes();renderPlans();renderRewards();
  $('#starFab').style.display='grid';
  if(location.hash==='#watch')enterWatch();
  if(!S.seen){welcome();S.seen=true;save('seen')}
  // 设置默认日期为今天,便于添加任务
  const today=dayKey();
  $('#plStart').value=addDays(today,-7);$('#plEnd').value=addDays(today,60);
  $('#psDue').value=today;
  // 锁屏保活音频源 + 恢复被打断的专注 + 启动即同步
  try{$('#ka').src=makeSilentWav()}catch(e){}
  restoreTimer();
  if(SYNCCFG)setTimeout(()=>syncNow(),1500);
}
init();
</script>
